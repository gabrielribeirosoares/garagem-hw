<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hot Wheels Collection | Cadastro</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Criar Conta</h1>
    <p>Registe-se para começar a sua coleção.</p>
    <form id="signup-form" autocomplete="off">
      <label>E-mail<input id="email" type="email" required /></label>
      <label>Senha<input id="password" type="password" minlength="8" required /></label>
      <label>Confirmar Senha<input id="confirm-password" type="password" minlength="8" required /></label>
      <button type="submit">Cadastrar</button>
    </form>
    <p style="text-align:center; margin-top:10px;">
      Já tem uma conta? <a href="index.html" style="color:var(--accent);">Faça login</a>
    </p>
  </main>
  <script type="module" src="assets/js/signup.js"></script>
</body>
</html>
