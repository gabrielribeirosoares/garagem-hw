<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diecast Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="assets/css/styles.css" />

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f59e0b">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Garagem HW">

  <style>
    body {
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.98);

      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      overflow: hidden;

    }

    .welcome-overlay.active {
      opacity: 1;
      pointer-events: all;
    }


    .impala-car {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 700px;

      transform: translate(-150vw, -50%);

      z-index: 2;
      filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.5));

    }


    .welcome-overlay.active .impala-car {
      animation: driveAcross 3.0s cubic-bezier(0.4, 0.0, 0.2, 1) forwards;
    }


    .welcome-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      color: #f9fafb;
      letter-spacing: 2px;
      margin: 0;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      z-index: 1;
      position: relative;
    }


    .welcome-overlay.active .welcome-text {

      animation: textFadeIn 0.6s ease-out forwards 1.5s;
    }


    @keyframes driveAcross {
      0% {
        transform: translate(-150vw, -50%);
      }

      40% {
        transform: translate(-20vw, -50%);
      }


      60% {
        transform: translate(20vw, -50%);
      }

      100% {
        transform: translate(150vw, -50%);
      }


    }

    @keyframes textFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body class="auth-body">

  <div id="welcome-overlay" class="welcome-overlay">
    <img src="assets/img/impala.png" alt="Impala 69" class="impala-car" onerror="this.style.display='none'">

    <h2 id="welcome-message" class="welcome-text">Olá, seja muito bem-vindo(a) à sua Garagem.</h2>
  </div>

  <main class="auth-card">
    <h1>Diecast Manager</h1>
    <p>Acesse sua coleção com e-mail e senha.</p>

    <div id="error-message"
      style="display: none; color: #ff6b6b; background: rgba(255, 107, 107, 0.1); border: 1px solid #ff6b6b; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: 500;">
      Falha no login. Verifique seu e-mail e senha.
    </div>

    <form id="login-form" autocomplete="on">
      <label>E-mail<input id="email" type="email" required /></label>

      <label>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          Senha
          <a href="#" id="forgot-password-link" style="font-size: 12px; color: #f59e0b; text-decoration: none;">Esqueci
            a senha</a>
        </div>
        <input id="password" type="password" minlength="6" required />
      </label>
      <button type="submit">Entrar</button>
    </form>

    <button id="btn-google"
      style="margin-top: 15px; width: 100%; padding: 10px; background: #fff; color: #333; border: 1px solid #ccc; cursor: pointer; border-radius: 4px; font-weight: bold; font-family: sans-serif;">
      Entrar com Google
    </button>
    <p style="text-align:center; margin-top:10px;">
      Não tem uma conta? <a href="signup.html"
        style="color:var(--accent); font-weight: bold; font-style: italic">Registre-se aqui</a>
    </p>
  </main>

  <div id="forgot-password-modal" class="welcome-overlay">
    <div class="auth-card"
      style="position: relative; z-index: 10000; width: 90%; max-width: 400px; padding: 25px; margin: 0;">
      <h2 style="font-family: 'Bebas Neue', sans-serif; color: #f59e0b; margin-top: 0;">Recuperar Senha</h2>
      <p style="font-size: 14px; color: #cbd5e1; margin-bottom: 15px; line-height: 1.5;">Digite o e-mail associado à sua
        conta. Enviaremos um link para você criar uma nova senha.</p>

      <div id="reset-message"
        style="display: none; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: 500;">
      </div>

      <input type="email" id="reset-email" placeholder="Seu e-mail"
        style="width: 100%; padding: 12px; margin-bottom: 20px; background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box;">

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" id="btn-close-reset"
          style="background: #64748b; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Cancelar</button>
        <button type="button" id="btn-send-reset"
          style="background: #f59e0b; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Enviar
          Link</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/auth.js?v=6"></script>
  <script>

    if ('serviceWorker' in navigator) {
      caches.keys().then(function (names) {
        for (let name of names) caches.delete(name);
      });
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>

</html>
